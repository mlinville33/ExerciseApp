version: '3.8'

services:
  backend:
    build:
      context: ./backendAPI
      dockerfile: dockerfile
    container_name: exercise_api
    ports:
      - "8000:8000"
    environment:
      - POETRY_NO_INTERACTION=1
      - POETRY_VIRTUALENVS_CREATE=false
      - EXERCISE_DB_PATH=/app/data/exercise.db
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    command: poetry run uvicorn src.index:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backendAPI:/app
      - exercise_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: exercise_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      # react-scripts needs polling to see edits on a bind mount
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  exercise_data:
