<!--
  App icon source. The mark is the brand diamond from the nav, drawn as paths
  rather than the glyph so it does not depend on a font being present.
  Render to PNG with: npm run assets:render
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff" />
      <stop offset="1" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#16233a" />
      <stop offset="1" stop-color="#070c16" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#4c8dff" stop-opacity="0.32" />
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)" />
  <rect width="1024" height="1024" fill="url(#glow)" />

  <g transform="translate(512 512) rotate(45)">
    <rect x="-224" y="-224" width="448" height="448" rx="52"
          fill="none" stroke="url(#mark)" stroke-width="60" />
    <rect x="-96" y="-96" width="192" height="192" rx="26" fill="url(#mark)" />
  </g>
</svg>
