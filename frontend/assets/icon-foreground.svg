<!--
  Android adaptive-icon foreground: the mark alone on transparency, scaled to
  about 55% so it survives the circle / squircle / teardrop masks OEMs apply.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff" />
      <stop offset="1" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <g transform="translate(512 512) rotate(45) scale(0.62)">
    <rect x="-224" y="-224" width="448" height="448" rx="52"
          fill="none" stroke="url(#mark)" stroke-width="60" />
    <rect x="-96" y="-96" width="192" height="192" rx="26" fill="url(#mark)" />
  </g>
</svg>
