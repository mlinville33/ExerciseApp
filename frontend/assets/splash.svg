<!--
  Splash source. Square and heavily padded because the launch screen is centre
  cropped to every aspect ratio from a tall phone to a landscape tablet.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="2732" height="2732" viewBox="0 0 2732 2732">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff" />
      <stop offset="1" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#4c8dff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="2732" height="2732" fill="#070c16" />
  <rect width="2732" height="2732" fill="url(#glow)" />
  <g transform="translate(1366 1366) rotate(45) scale(0.85)">
    <rect x="-224" y="-224" width="448" height="448" rx="52"
          fill="none" stroke="url(#mark)" stroke-width="60" />
    <rect x="-96" y="-96" width="192" height="192" rx="26" fill="url(#mark)" />
  </g>
</svg>
